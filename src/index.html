<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Try-On Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-theme="minimal">
    <main class="shell">
      <nav class="studio-nav" aria-label="视觉风格">
        <span>TRY-ON LAB</span>
        <div class="theme-switcher" id="themeSwitcher" role="group" aria-label="切换页面风格">
          <button class="theme-button active" type="button" data-theme="minimal">A Minimal</button>
          <button class="theme-button" type="button" data-theme="dark">B Dark</button>
          <button class="theme-button" type="button" data-theme="editorial">C Editorial</button>
        </div>
        <span>LOCAL ONLY</span>
      </nav>

      <header class="topbar">
        <div>
          <p class="eyebrow">PRIVATE FITTING STUDY</p>
          <h1>Personal<br />Fitting<br />Study</h1>
          <p class="subtitle">A quiet local studio for comparing virtual try-on outputs.</p>
          <p class="privacy-note">本版本仅在本机浏览器处理图片，不调用远端 API，不上传图片。</p>
        </div>
        <button class="icon-button" id="resetButton" type="button" aria-label="重置本次测试" title="重置本次测试">
          ↻
        </button>
      </header>

      <section class="workspace" aria-label="试穿输入">
        <div class="upload-grid">
          <label class="dropzone" id="personDropzone">
            <input id="personInput" type="file" accept="image/png,image/jpeg,image/webp" />
            <span class="dropzone-index">01</span>
            <span class="dropzone-label">PERSON</span>
            <span class="dropzone-copy">ADD FULL BODY IMAGE</span>
            <img id="personPreview" alt="" hidden />
            <span class="dropzone-error" id="personError"></span>
          </label>

          <label class="dropzone" id="garmentDropzone">
            <input id="garmentInput" type="file" accept="image/png,image/jpeg,image/webp" />
            <span class="dropzone-index">02</span>
            <span class="dropzone-label">GARMENT</span>
            <span class="dropzone-copy">ADD PRODUCT IMAGE</span>
            <img id="garmentPreview" alt="" hidden />
            <span class="dropzone-error" id="garmentError"></span>
          </label>
        </div>

        <div class="control-panel">
          <div class="control-block">
            <span class="control-title">MODEL</span>
            <div class="pill-row" id="providerGroup" role="group" aria-label="模型选择"></div>
          </div>

          <div class="control-block">
            <span class="control-title">MODE</span>
            <div class="segment" role="radiogroup" aria-label="生成模式">
              <label><input type="radio" name="mode" value="real" checked />Real</label>
              <label><input type="radio" name="mode" value="soft" />Soft</label>
              <label><input type="radio" name="mode" value="editorial" />Editorial</label>
            </div>
          </div>

          <div class="action-row">
            <p class="inline-error" id="formError"></p>
            <button class="primary-button" id="generateButton" type="button">Generate Study</button>
          </div>
        </div>
      </section>

      <section class="results-section" aria-label="生成结果">
        <div class="section-heading">
          <div>
            <p class="eyebrow">MODEL COMPARISON</p>
            <h2>Study Output</h2>
          </div>
          <button class="secondary-button" id="saveButton" type="button" disabled>Save Study</button>
        </div>

        <div class="empty-state" id="emptyState">
          <p>No study yet.</p>
          <span>Add a person image and a garment to begin.</span>
        </div>

        <div class="result-grid" id="resultGrid" hidden></div>
      </section>

      <section class="saved-section" aria-label="已保存评测">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">LOCAL NOTES</p>
            <h2>Saved Studies</h2>
          </div>
          <button class="secondary-button" id="clearSavedButton" type="button">Clear</button>
        </div>
        <div class="saved-list" id="savedList"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
