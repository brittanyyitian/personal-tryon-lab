<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Try-On Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PRIVATE FITTING STUDY</p>
          <h1>Personal Try-On Lab</h1>
          <p class="subtitle">上传本人图和衣服图，并排评测不同 AI 试穿模型。</p>
        </div>
        <button class="icon-button" id="resetButton" type="button" aria-label="重置本次测试" title="重置本次测试">
          ↻
        </button>
      </header>

      <section class="workspace" aria-label="试穿输入">
        <div class="upload-grid">
          <label class="dropzone" id="personDropzone">
            <input id="personInput" type="file" accept="image/png,image/jpeg,image/webp" />
            <span class="dropzone-label">人物参考图</span>
            <span class="dropzone-copy">上传正面全身照</span>
            <img id="personPreview" alt="" hidden />
            <span class="dropzone-error" id="personError"></span>
          </label>

          <label class="dropzone" id="garmentDropzone">
            <input id="garmentInput" type="file" accept="image/png,image/jpeg,image/webp" />
            <span class="dropzone-label">衣服参考图</span>
            <span class="dropzone-copy">上传商品图或截图</span>
            <img id="garmentPreview" alt="" hidden />
            <span class="dropzone-error" id="garmentError"></span>
          </label>
        </div>

        <div class="control-panel">
          <div class="control-block">
            <span class="control-title">模型</span>
            <div class="pill-row" id="providerGroup" role="group" aria-label="模型选择"></div>
          </div>

          <div class="control-block">
            <span class="control-title">模式</span>
            <div class="segment" role="radiogroup" aria-label="生成模式">
              <label><input type="radio" name="mode" value="real" checked />真实试穿</label>
              <label><input type="radio" name="mode" value="soft" />轻美化</label>
              <label><input type="radio" name="mode" value="editorial" />出片图</label>
            </div>
          </div>

          <div class="action-row">
            <p class="inline-error" id="formError"></p>
            <button class="primary-button" id="generateButton" type="button">开始生成</button>
          </div>
        </div>
      </section>

      <section class="results-section" aria-label="生成结果">
        <div class="section-heading">
          <div>
            <p class="eyebrow">MODEL COMPARISON</p>
            <h2>结果对比</h2>
          </div>
          <button class="secondary-button" id="saveButton" type="button" disabled>保存本次评测</button>
        </div>

        <div class="empty-state" id="emptyState">
          <p>还没有生成记录。</p>
          <span>上传两张图片后，这里会出现模型横向对比和评分。</span>
        </div>

        <div class="result-grid" id="resultGrid" hidden></div>
      </section>

      <section class="saved-section" aria-label="已保存评测">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">LOCAL NOTES</p>
            <h2>已保存评测</h2>
          </div>
          <button class="secondary-button" id="clearSavedButton" type="button">清空</button>
        </div>
        <div class="saved-list" id="savedList"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
